<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Liquidaciones y Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-vinotinto { background-color: #6b1d2f; }
        .hover-bg-vinotinto:hover { background-color: #521523; }
        .text-vinotinto { color: #6b1d2f; }
        .border-vinotinto { border-color: #6b1d2f; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Encabezado Principal con Menú -->
    <header class="bg-vinotinto text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-folder-open text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">Base de Datos de Impuestos y Registros</h1>
            </div>

            <!-- Navegación por Pestañas -->
            <div class="flex bg-slate-900 bg-opacity-30 p-1 rounded-xl space-x-1">
                <button id="tabBtnRegistros" onclick="cambiarVista('registros')" class="px-4 py-2 rounded-lg text-sm font-semibold transition bg-white text-vinotinto shadow">
                    <i class="fa-solid fa-table-list mr-2"></i>Registros
                </button>
                <button id="tabBtnDashboard" onclick="cambiarVista('dashboard')" class="px-4 py-2 rounded-lg text-sm font-semibold transition text-white hover:bg-white hover:bg-opacity-10">
                    <i class="fa-solid fa-chart-pie mr-2"></i>Dashboard
                </button>
            </div>

            <button onclick="abrirModalNuevo()" class="bg-white text-vinotinto px-4 py-2 rounded-lg font-semibold text-sm shadow hover:bg-slate-100 transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Nuevo Registro</span>
            </button>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- VISTA 1: TABLA DE REGISTROS -->
        <section id="vistaRegistros" class="space-y-6">
            <!-- Buscador y Filtros -->
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="inputBuscar" onkeyup="filtrarTabla()" placeholder="Buscar por archivo, liquidación, beneficiario..." class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-lg text-sm focus:outline-none focus:border-vinotinto">
                </div>
                <div class="text-xs text-slate-500 font-medium">
                    Registros cargados: <span id="cantRegistros" class="font-bold text-slate-700">0</span>
                </div>
            </div>

            <!-- Tabla de Datos -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 uppercase text-xs font-semibold tracking-wider border-b border-slate-200">
                                <th class="py-3 px-4">N° Archivo</th>
                                <th class="py-3 px-4">Liquidación</th>
                                <th class="py-3 px-4">Beneficiario</th>
                                <th class="py-3 px-4">Identificación</th>
                                <th class="py-3 px-4">Estado</th>
                                <th class="py-3 px-4 text-center">Documentos</th>
                                <th class="py-3 px-4 text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaCuerpo" class="divide-y divide-slate-100 text-sm">
                            <tr>
                                <td colspan="7" class="text-center py-8 text-slate-400">
                                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                    <p>Cargando información desde la base de datos...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VISTA 2: DASHBOARD INDICADORES -->
        <section id="vistaDashboard" class="space-y-6 hidden">
            <!-- Tarjetas KPI -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Expedientes</p>
                        <h3 id="kpiTotal" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-slate-100 text-vinotinto flex items-center justify-center text-xl">
                        <i class="fa-solid fa-folder"></i>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Aprobados</p>
                        <h3 id="kpiAprobados" class="text-2xl font-bold text-emerald-600 mt-1">0</h3>
                    </div>
                    <div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-
